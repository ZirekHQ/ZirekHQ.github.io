name: Build docs

# Reusable: builds the site and uploads it as a plain build
# artifact. Called by ci.yml (on every PR, as a
# status check) and deploy.yml (on push to main, before publishing). Keeping
# this in one place means adding a component only needs updating here, not
# separately in a PR-check copy that can drift out of sync.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Write language-root redirect
        run: cp site-redirect.html build/site/index.html

      # Optional: swap Lunr for Pagefind's WASM-based chunked index. Pagefind
      # post-processes the built site rather than running as an Antora
      # extension, so drop `@antora/lunr-extension` from antora-playbook.yml
      # and the search partial in supplemental-ui when switching to it.
      # - name: Index with Pagefind
      #   run: npx pagefind --site build/site

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: build/site
          retention-days: 7

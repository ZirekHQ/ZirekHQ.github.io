name: Deploy docs

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [update-docs]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install po4a
        run: sudo apt-get update && sudo apt-get install -y po4a

      - name: Check out pilot component sources for translation
        run: |
          git clone --depth 1 --branch main https://github.com/ZirekHQ/dengjen-tts.git .translation-src/dengjen-tts
          git clone --depth 1 --branch main https://github.com/ZirekHQ/dengjen-nvda.git .translation-src/dengjen-nvda
          git clone --depth 1 --branch main https://github.com/ZirekHQ/dengjen-piper-rs.git .translation-src/dengjen-piper-rs
          git clone --depth 1 --branch main https://github.com/ZirekHQ/nvda-addon-testkit.git .translation-src/nvda-addon-testkit
          git clone --depth 1 --branch main https://github.com/ZirekHQ/dengjen-tashkeel.git .translation-src/dengjen-tashkeel
          git clone --depth 1 --branch main https://github.com/ZirekHQ/pact-avro-plugin.git .translation-src/pact-avro-plugin

      - name: Stage untranslated component trees
        run: |
          mkdir -p build/docs/kmr
          cp -r docs build/docs/kmr/home
          cp -r .translation-src/dengjen-tts/docs build/docs/kmr/dengjen-tts
          cp -r .translation-src/dengjen-nvda/docs build/docs/kmr/dengjen-nvda
          cp -r .translation-src/dengjen-piper-rs/docs build/docs/kmr/dengjen-piper-rs
          cp -r .translation-src/dengjen-tashkeel/docs build/docs/kmr/dengjen-tashkeel
          # nvda-addon-testkit and pact-avro-plugin link doc examples out to
          # source code living outside docs/, so stage the whole repo (minus
          # .git) rather than just docs/, to keep those relative symlinks
          # resolvable.
          cp -r .translation-src/nvda-addon-testkit build/docs/kmr/nvda-addon-testkit && rm -rf build/docs/kmr/nvda-addon-testkit/.git
          cp -r .translation-src/pact-avro-plugin build/docs/kmr/pact-avro-plugin && rm -rf build/docs/kmr/pact-avro-plugin/.git

      - name: Generate Kurmanji AsciiDoc via po4a
        run: po4a --no-update --keep 0 po4a.cfg

      - name: Build English site
        run: SITE_LANG=en npx antora --fetch antora-playbook.yml

      - name: Build Kurmanji site
        run: SITE_LANG=kmr npx antora antora-playbook-kmr.yml

      - name: Write language-root redirect
        run: cp site-redirect.html build/site/index.html

      # Optional: swap Lunr for Pagefind's WASM-based chunked index. Pagefind
      # post-processes the built site rather than running as an Antora
      # extension, so drop `@antora/lunr-extension` from antora-playbook.yml
      # and the search partial in supplemental-ui when switching to it.
      # - name: Index with Pagefind
      #   run: npx pagefind --site build/site

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

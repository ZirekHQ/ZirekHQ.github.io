name: Build docs

# Reusable: builds the site and uploads it as a plain build
# artifact. Called by ci.yaml (on every PR, as a
# status check) and deploy.yaml (on push to main, before publishing). Keeping
# this in one place means adding a component only needs updating here, not
# separately in a PR-check copy that can drift out of sync.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Build site
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional: swap Lunr for Pagefind's WASM-based chunked index. Pagefind
      # post-processes the built site rather than running as an Antora
      # extension, so drop `@antora/lunr-extension` from antora-playbook.yaml
      # and the search partial in supplemental-ui when switching to it.
      # - name: Index with Pagefind
      #   run: npx pagefind --site build/site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: build/site
          retention-days: 7

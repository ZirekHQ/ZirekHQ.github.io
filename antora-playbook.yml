site:
  title: ZirekHQ
  url: https://zirekhq.github.io
  start_page: home::index.adoc
  robots: allow

runtime:
  cache_dir: ./.cache/antora
  log:
    format: pretty
    level: info
    failure_level: warn

content:
  sources:
    # This repo's own docs/ -- the org home page (component `home`), not tied to
    # any product version. `branches: HEAD` tracks whatever ref is checked out,
    # so it works both in CI (detached HEAD from actions/checkout) and locally.
    - url: .
      branches: HEAD
      start_path: docs

    # Pilot components. Add one entry per repo here to onboard it, each repo
    # owns its own docs/ via `docs/antora.yml`. Version comes from each
    # component's own antora.yml (all currently `version: true`, i.e. the
    # branch name), not from a `version:` map here -- Antora always prefers
    # the version declared in antora.yml when the file has one.
    - url: https://github.com/ZirekHQ/dengjen-tts.git
      branches:
        - main
      start_path: docs
    - url: https://github.com/ZirekHQ/dengjen-nvda.git
      branches:
        - main
      start_path: docs
    - url: https://github.com/ZirekHQ/dengjen-piper-rs.git
      branches:
        - main
      start_path: docs
    - url: https://github.com/ZirekHQ/nvda-addon-testkit.git
      branches:
        - main
      start_path: docs
    - url: https://github.com/ZirekHQ/dengjen-tashkeel.git
      branches:
        - main
      start_path: docs
    - url: https://github.com/ZirekHQ/pact-avro-plugin.git
      branches:
        - main
      start_path: docs
    - url: https://github.com/ZirekHQ/dengjen-werger.git
      branches:
        - main
      start_path: docs

ui:
  bundle:
    url: https://github.com/ZirekHQ/docs-ui-bundle/releases/download/latest/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

antora:
  extensions:
    - require: '@antora/lunr-extension'

output:
  clean: true
  dir: ./build/site/en

asciidoc:
  attributes:
    page-layout: with_menu
    idprefix: ''
    idseparator: '-'
    page-pagination: ''
    experimental: ''
  extensions:
    - '@asciidoctor/tabs'

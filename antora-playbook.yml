site:
  title: ZirekHQ
  url: https://zirekhq.github.io
  start_page: home::index.adoc
  robots: allow

runtime:
  cache_dir: ./.cache/antora
  log:
    format: pretty
    level: info
    failure_level: warn

content:
  sources:
    # This repo's own docs/ -- the org home page (component `home`), not tied to
    # any product version. `branches: HEAD` tracks whatever ref is checked out,
    # so it works both in CI (detached HEAD from actions/checkout) and locally.
    - url: .
      branches: HEAD
      start_path: docs

    # One entry per repo; each repo owns its docs/ via docs/antora.yml.
    # Versions come from extensions/doc-versions.js.
    - url: https://github.com/ZirekHQ/dengjen-tts.git
      tags:
        - 'v*.*.*'
        - '!v*-*'
        # Antora fails on a tag without docs/; negate tags older than the repo's docs.
        - '!v1.1.0'
      branches:
        - main
      start_path: docs
    - url: https://github.com/ZirekHQ/dengjen-nvda.git
      tags:
        - 'v*.*.*'
        - '!v*-*'
        - '!v3.*'
        - '!v4.0.*'
      branches:
        - main
      start_path: docs
    - url: https://github.com/ZirekHQ/dengjen-piper-rs.git
      tags:
        - 'v*.*.*'
        - '!v*-*'
        - '!v0.2.0'
      branches:
        - main
      start_path: docs
    - url: https://github.com/ZirekHQ/nvda-addon-testkit.git
      tags:
        - 'v*.*.*'
        - '!v*-*'
        - '!v0.1.0'
        - '!v0.1.1'
      branches:
        - main
      start_path: docs
    - url: https://github.com/ZirekHQ/dengjen-tashkeel.git
      tags:
        - 'v*.*.*'
        - '!v*-*'
        - '!v1.5.*'
      branches:
        - main
      start_path: docs
    # Hardcodes `version:` in docs/antora.yml, so Antora merges every tag into
    # one version before the extension runs; pinned until it uses `version: true`.
    - url: https://github.com/ZirekHQ/pact-avro-plugin.git
      tags:
        - v0.0.6
      branches:
        - main
      start_path: docs
    - url: https://github.com/ZirekHQ/dengjen-werger.git
      tags:
        - 'v*.*.*'
        - '!v*-*'
      branches:
        - main
      start_path: docs

ui:
  bundle:
    url: https://github.com/ZirekHQ/docs-ui-bundle/releases/download/latest/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

antora:
  extensions:
    - require: ./extensions/doc-versions.js
      unversioned: [home]
    - require: '@antora/lunr-extension'

output:
  clean: true
  dir: ./build/site/en

asciidoc:
  attributes:
    page-layout: with_menu
    idprefix: ''
    idseparator: '-'
    page-pagination: ''
    experimental: ''
  extensions:
    - '@asciidoctor/tabs'
